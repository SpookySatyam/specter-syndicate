<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a00e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e2de2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Background representing night/stealth -->
  <circle cx="50" cy="50" r="48" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  
  <!-- Specter shape -->
  <path d="M 50 20 
           C 30 20, 25 35, 25 50 
           L 25 80
           L 33 72
           L 41 80
           L 50 72
           L 59 80
           L 67 72
           L 75 80
           L 75 50
           C 75 35, 70 20, 50 20 Z" 
        fill="url(#ghostGrad)" />
        
  <!-- Glowing Eyes -->
  <path d="M 35 45 Q 40 40 45 45 Q 40 48 35 45 Z" fill="#00ffcc" filter="url(#glow)"/>
  <path d="M 55 45 Q 60 40 65 45 Q 60 48 55 45 Z" fill="#00ffcc" filter="url(#glow)"/>
</svg>